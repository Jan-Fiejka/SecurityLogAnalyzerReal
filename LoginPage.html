<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SecurityLogAnalyzer – Login</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #eef2f7; color: #172033; }
		.card { width: min(92%, 420px); padding: 2rem; background: white; border-radius: 14px; box-shadow: 0 8px 30px #17203322; }
		h1 { margin-top: 0; font-size: 1.6rem; }
		label { display: block; margin: 1rem 0 .35rem; font-weight: bold; }
		input, button { width: 100%; padding: .75rem; border-radius: 7px; font-size: 1rem; }
		input { border: 1px solid #b8c2d1; }
		button { margin-top: 1.2rem; border: 0; color: white; background: #2563eb; cursor: pointer; }
		button:hover { background: #1d4ed8; }
		#message { min-height: 1.4em; margin-top: 1rem; font-weight: bold; }
		.test-users { margin-top: 1.5rem; padding: 1rem; background: #f3f6fa; border-radius: 8px; font-size: .9rem; }
		code { background: #e2e8f0; padding: .1rem .3rem; border-radius: 3px; }
	</style>
</head>
<body>
	<main class="card">
		<h1>SecurityLogAnalyzer</h1>
		<p>Bitte melde dich an.</p>

		<form id="loginForm">
			<label for="username">Benutzername</label>
			<input id="username" name="username" required autocomplete="username">
			<label for="password">Passwort</label>
			<input id="password" name="password" type="password" required autocomplete="current-password">
			<button type="submit">Einloggen</button>
		</form>
		<p id="message" role="status"></p>

		<section class="test-users">
			<strong>Testzugänge</strong>
			<ul>
				<li><code>anna</code> / <code>test1</code></li>
				<li><code>ben</code> / <code>test2</code></li>
				<li><code>cara</code> / <code>test3</code></li>
			</ul>

		</section>
	</main>

	<script>
		// Demo-Daten: In einer echten Anwendung müssen Login und Prüfung serverseitig erfolgen.
		const users = { anna: 'test1', ben: 'test2', cara: 'test3' };
		const form = document.getElementById('loginForm');
		const message = document.getElementById('message');

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			const username = form.username.value.trim();
			const success = users[username] === form.password.value;
			const logEntry = {
				timestamp: new Date().toISOString(), username, success,
				userAgent: navigator.userAgent
			};
			const logs = JSON.parse(localStorage.getItem('securityLogs') || '[]');
			logs.push(logEntry);
			localStorage.setItem('securityLogs', JSON.stringify(logs));
			console.log('Login-Ereignis:', logEntry);
			message.textContent = success ? 'Login erfolgreich.' : 'Benutzername oder Passwort falsch.';
			message.style.color = success ? '#16803c' : '#c52222';
			if (success) form.reset();
		});
	</script>
</body>
</html>
